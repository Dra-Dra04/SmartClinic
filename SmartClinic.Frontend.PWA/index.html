    <meta charset="UTF-8" />
    <script>
      // Early shim for browser extensions/interceptors attempting to override window.fetch
      (function() {
        try {
          var _rawFetch = window.fetch;
          var _fetchHandler = _rawFetch ? _rawFetch.bind(window) : function() {
            return Promise.reject(new Error('Fetch not available'));
          };
          Object.defineProperty(window, 'fetch', {
            get: function() {
              return _fetchHandler;
            },
            set: function(fn) {
              _fetchHandler = fn;
            },
            configurable: true,
            enumerable: true
          });
        } catch (e) {
          // Ignore if cannot redefine
        }

        // Suppress external extension errors
        window.addEventListener('error', function(e) {
          if (
            (e.filename && e.filename.indexOf('chrome-extension://') !== -1) ||
            (e.message && e.message.indexOf('Cannot set property fetch of') !== -1)
          ) {
            e.preventDefault();
            e.stopPropagation();
            return true;
          }
        }, true);
      })();
    </script>
